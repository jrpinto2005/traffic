[project]
name = "traffic-lab"
version = "0.0.0"
description = "Research platform for adaptive traffic signal control"
requires-python = ">=3.12"

dependencies = [
    # Simulation backend. Installed as a Python distribution rather than a system
    # package so the SUMO version is pinned in uv.lock — see D-004 and D-008.
    "eclipse-sumo==1.27.1",
    "libsumo==1.27.1",
    "traci==1.27.1",
    "sumolib==1.27.1",
    # Core
    "numpy>=2.0",
    # polars writes/reads parquet natively (Rust arrow-rs). pyarrow is deliberately
    # NOT a dependency: it collides with libsumo's bundled libarrow. See D-004.
    "polars>=1.0",
    "duckdb>=1.0",
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "matplotlib>=3.9",
]

[project.scripts]
traffic-lab = "traffic_lab.experiments.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
    # Type stubs for mypy --strict; yaml.safe_load is otherwise untyped.
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"
# Spike code is throwaway by policy (08_AGENT_HANDOFF_PROTOCOL.md §2.1) and is never
# imported by traffic_lab; holding it to the package's lint bar would make
# `ruff check` unpassable for no gain.
extend-exclude = ["spikes"]

[tool.ruff.format]
# The Python blocks in the documents are contracts with deliberate alignment.
# Reformatting them is churn in frozen text, not a style fix.
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
# Plain `mypy` checks both, so the command in the README is the whole check.
files = ["traffic_lab", "tests"]
# Strict everywhere, not per package. D-004 needs it on `domain/`, where the
# truth/observation separation depends on types being real rather than
# decorative, and 06_ARCHITECTURE.md §4.3 needs it on `control/`, the second of
# the three layers that keep TrueState out of the control path. Everything else
# already passed strict; making it global stops a new package from silently
# starting out lax.
strict = true
warn_unused_ignores = true
warn_redundant_casts = true

[tool.pytest.ini_options]
testpaths = ["tests"]
