[project]
name = "traffic-lab"
version = "0.0.0"
description = "Research platform for adaptive traffic signal control"
requires-python = ">=3.12"

dependencies = [
    # Simulation backend. Installed as a Python distribution rather than a system
    # package so the SUMO version is pinned in uv.lock — see D-004 and D-008.
    "eclipse-sumo==1.27.1",
    "libsumo==1.27.1",
    "traci==1.27.1",
    "sumolib==1.27.1",
    # Core
    "numpy>=2.0",
    # polars writes/reads parquet natively (Rust arrow-rs). pyarrow is deliberately
    # NOT a dependency: it collides with libsumo's bundled libarrow. See D-004.
    "polars>=1.0",
    "duckdb>=1.0",
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "matplotlib>=3.9",
]

[project.scripts]
traffic-lab = "traffic_lab.experiments.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
    # Type stubs for mypy --strict; yaml.safe_load is otherwise untyped.
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
warn_redundant_casts = true

# D-004: strict on the domain package, where the truth/observation separation
# depends on types being real rather than decorative.
[[tool.mypy.overrides]]
module = "traffic_lab.domain.*"
strict = true

# T1.7 / 06_ARCHITECTURE.md §4.3: strict on the control package too. The second
# of the three layers that keep TrueState out of the control path — the
# Controller protocol and the constraint layer must accept EstimatedState only.
[[tool.mypy.overrides]]
module = "traffic_lab.control.*"
strict = true

# Strict on the backend too: it is the only package that touches SUMO, and
# `06_ARCHITECTURE.md` SS5 makes it the most correctness-sensitive code in M1.
[[tool.mypy.overrides]]
module = "traffic_lab.backend.*"
strict = true

# traci, libsumo and sumolib ship no type information. Only the backend package
# may import them (`06_ARCHITECTURE.md` SS10 rule 2), so the exemption is
# confined to those three distributions rather than applied project-wide.
[[tool.mypy.overrides]]
module = ["traci.*", "traci", "libsumo.*", "libsumo", "sumolib.*", "sumolib"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
